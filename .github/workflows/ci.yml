name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: re-resolves "latest" so a new BullMQ 6.x release that breaks the backend
  # (or the conformance gate) shows up without a push to this repository.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # bullmq: pinned = the lockfile's devDependency; oldest / latest = the ends of the
    # peer range in packages/memory/package.json (installed by scripts/use-bullmq.mjs).
    name: typecheck + tests (Node ${{ matrix.node }}, bullmq ${{ matrix.bullmq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        bullmq: [pinned, oldest, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.bullmq != 'pinned'
        run: pnpm bullmq:use ${{ matrix.bullmq }}
      - run: pnpm typecheck
      # Builds the package, runs the unit/behaviour suite, then compiles and runs
      # every ```ts block of README.md against the built package.
      - run: pnpm test

  conformance:
    # Gate: runs BullMQ's own shared test suite (at the installed version's git tag)
    # against the memory backend and fails if a test recorded in
    # conformance/baseline.json no longer passes. See docs/conformance.md.
    name: BullMQ shared suite gate (bullmq ${{ matrix.bullmq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bullmq: [pinned, oldest, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.bullmq != 'pinned'
        run: pnpm bullmq:use ${{ matrix.bullmq }}
      - run: pnpm conformance
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: 'true'
      - if: always()
        run: cat conformance/.work/summary.md >> "$GITHUB_STEP_SUMMARY"
