name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # OIDC dist-tag support requires npm >=11.21.0.
      - run: npm install --global npm@^11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Trusted publisher: this repository + release.yml on npmjs.com; no NPM_TOKEN.
      - run: npm publish --provenance --access public --tag latest
        working-directory: packages/memory
      # Dist-tag permission is independent of publish permission in npm's settings.
      - name: Update alpha dist-tag
        continue-on-error: true
        run: npm dist-tag add "bullmq-memory-backend@${GITHUB_REF_NAME#v}" alpha
