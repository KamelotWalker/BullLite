name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # After the first manual publish, configure this workflow as the trusted
      # publisher for bullmq-memory-backend on npmjs.com. No NPM_TOKEN is used.
      - run: npm publish --provenance --access public --tag alpha
        working-directory: packages/memory
